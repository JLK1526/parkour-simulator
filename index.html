<title>跑酷模拟器</title>
<style>
  :root{
    --accent:#2f7bff; --accent-deep:#1652c9; --accent-soft:rgba(47,123,255,.15);
    --danger:#ff4d4f; --gold:#f5b301;
  }
  html[data-theme="light"]{
    --bg:#eaf3ff; --panel:#ffffff; --panel-2:#f3f8ff;
    --text:#14335e; --text-sub:#5b7aa8; --border:#cfe0fa;
    --shadow:0 14px 36px rgba(30,80,160,.16);
  }
  html[data-theme="dark"]{
    --bg:#07142b; --panel:#10213f; --panel-2:#152a4d;
    --text:#e8f1ff; --text-sub:#93a9cc; --border:#24406e;
    --shadow:0 14px 36px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 50% -10%,var(--panel-2),var(--bg) 68%);
    color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:64px 18px 18px;transition:background .3s,color .3s;
  }
  #app{width:100%;max-width:920px}
  .screen{display:none}
  .screen.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- 通用 ---------- */
  .btn{
    border:1px solid var(--border);cursor:pointer;font:inherit;font-weight:700;
    color:var(--text);background:var(--panel-2);border-radius:13px;
    padding:12px 20px;transition:transform .12s,box-shadow .2s,background .2s;user-select:none;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px) scale(.98)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(47,123,255,.35);font-size:17px;padding:15px 38px}
  .btn.ghost{background:transparent;font-size:13px;padding:9px 14px}
  .btn.danger{background:linear-gradient(135deg,#ff6b6b,#e64545);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(255,77,79,.3);font-size:16px;padding:13px 32px}

  /* ---------- 开始界面 ---------- */
  .hero{background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:34px 30px 30px;text-align:center}
  .badge-top{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--border);padding:6px 16px;border-radius:999px;margin-bottom:12px}
  .runner-icon{margin:0 auto 4px;width:104px;height:84px}
  .hero h1{font-size:40px;line-height:1.1;letter-spacing:2px;margin-bottom:8px}
  .hero h1 span{color:var(--accent)}
  .hero p.sub{color:var(--text-sub);font-size:14px;line-height:1.7;margin-bottom:20px}
  .section-label{font-size:12px;color:var(--text-sub);letter-spacing:1px;margin-bottom:9px;font-weight:700}
  .diffrow{display:flex;gap:10px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
  .diff{
    flex:1;min-width:100px;max-width:170px;border:1px solid var(--border);background:var(--panel-2);
    border-radius:14px;padding:10px 8px;cursor:pointer;transition:.18s;color:var(--text);
  }
  .diff:hover{transform:translateY(-2px)}
  .diff.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
  .diff b{display:block;font-size:15px}
  .diff small{font-size:11px;color:var(--text-sub)}
  .diff.on b{color:var(--accent)}
  .howto{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
  .howto .item{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:9px 13px;font-size:13px}
  kbd{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;background:var(--accent);color:#fff;border-radius:8px;font-size:14px;font-weight:700}
  kbd.down{background:var(--accent-deep)}
  .gearline{font-size:12px;color:var(--text-sub);margin-bottom:18px}
  .gearline b{color:var(--accent)}
  .safe-note{font-size:11px;color:var(--text-sub);margin-top:7px}
  .safe-note b{color:var(--accent)}
  .btnrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .corner{position:fixed;top:16px;z-index:40;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
  .corner:hover{transform:translateY(-2px)}
  .corner:active{transform:translateY(1px) scale(.97)}
  .corner-left{left:16px}
  .corner-group{position:fixed;top:16px;right:16px;z-index:40;display:flex;gap:8px}
  .corner-group .corner{position:static}
  .sound-btn{padding:9px 12px;min-width:42px}
  .start-wrap{display:flex;justify-content:center;margin-top:18px}

  /* ---------- 游戏界面 ---------- */
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .hud .title{font-weight:800;letter-spacing:1px;color:var(--accent);font-size:15px}
  .stats{display:flex;gap:16px}
  .stat{font-size:11px;color:var(--text-sub);text-align:center}
  .stat b{display:block;font-size:18px;color:var(--text);line-height:1.2}
  .stat.coin b{color:var(--gold)}
  .canvas-wrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);background:var(--panel)}
  canvas{display:block;width:100%;height:auto;touch-action:none}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,18,40,.62);backdrop-filter:blur(4px);z-index:5}
  .overlay.show{display:flex;animation:fade .25s ease}
  .over-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:26px 30px;text-align:center;box-shadow:var(--shadow);min-width:290px}
  .over-card .ico{font-size:36px;margin-bottom:4px}
  .over-card h2{color:var(--danger);font-size:24px;margin-bottom:6px}
  .over-card p{color:var(--text-sub);font-size:13px;margin-bottom:2px}
  .over-card .final{font-size:32px;font-weight:800;color:var(--accent);margin:4px 0 6px}
  .over-card .earn{color:var(--gold);font-weight:800;margin-bottom:16px;font-size:14px}
  .over-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .controls{display:flex;gap:14px;margin-top:14px}
  .ctrl{flex:1;border:1px solid var(--border);border-radius:18px;padding:16px 8px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,filter .15s;user-select:none;touch-action:manipulation}
  .ctrl small{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.75);margin-top:3px}
  .ctrl.jump{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent}
  .ctrl.crouch{background:linear-gradient(135deg,#3a5fb0,#24407d);color:#fff;border-color:transparent}
  .ctrl:active,.ctrl.pressed{transform:scale(.96);filter:brightness(1.15)}
  .tip{text-align:center;color:var(--text-sub);font-size:11px;margin-top:12px}

  /* ---------- 商店 ---------- */
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(4,14,32,.66);backdrop-filter:blur(5px);padding:16px}
  .modal.show{display:flex;animation:fade .25s ease}
  .shop{width:100%;max-width:760px;max-height:90vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
  .shop-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
  .shop-head h2{font-size:20px;color:var(--accent)}
  .shop-head .right{display:flex;align-items:center;gap:14px}
  .wallet{background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-weight:800;color:var(--gold);font-size:14px}
  .coin-ico{width:1.2em;height:1.2em;display:inline-block;vertical-align:-.2em;margin-right:3px;flex:none}
  .btn .coin-ico{width:1.05em;height:1.05em;vertical-align:-.15em;margin-right:1px}
  .close{border:none;background:var(--panel-2);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
  .tabs{display:flex;gap:8px;padding:14px 22px 8px}
  .tab{flex:1;border:1px solid var(--border);background:var(--panel-2);color:var(--text-sub);border-radius:11px;padding:9px;cursor:pointer;font:inherit;font-weight:700;font-size:14px}
  .tab.on{background:var(--accent);color:#fff;border-color:transparent}
  .shop-body{overflow-y:auto;padding:10px 22px 22px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px}
  .card.equipped{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .preview{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:27px;background:var(--panel);border:1px solid var(--border)}
  .swatch{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.2)}
  .card .name{font-size:14px;font-weight:800}
  .card .desc{font-size:11px;color:var(--text-sub);min-height:30px;line-height:1.4}
  .card .buy{width:100%;padding:8px 4px;font-size:12px;border-radius:9px}
  .card .buy.owned{background:var(--accent-soft);color:var(--accent)}
  .card .buy.active{background:var(--accent);color:#fff;border-color:transparent}
  .shop-foot{font-size:11px;color:var(--text-sub);text-align:center;padding:0 22px 16px}

  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:80;background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:999px;padding:10px 20px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:600px){
    .hero{padding:26px 18px 24px}.hero h1{font-size:32px}
    .stats{gap:9px}.stat b{font-size:15px}.hud .title{display:none}
    .grid{grid-template-columns:repeat(2,1fr)}
    .ctrl{font-size:16px;padding:14px 5px}
  }
</style>
</head>

        <span class="wallet"><svg class="coin-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#c98a00"/><circle cx="12" cy="12" r="8.5" fill="#f5b301"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#ffe9a8" stroke-width="1" opacity=".8"/><text x="12" y="16.4" text-anchor="middle" font-size="12" font-weight="900" fill="#8a5a00">¥</text></svg><span id="walletVal">0</span></span>
        <button class="close" id="closeShop">×</button>
      </div>
    </div>
    <div class="tabs" id="shopTabs">
      <button class="tab on" data-tab="skin">角色皮肤</button>
      <button class="tab" data-tab="gear">个性装扮</button>
      <button class="tab" data-tab="skill">技能</button>
    </div>
    <div class="shop-body"><div class="grid" id="shopGrid"></div></div>
    <div class="shop-foot">金币固定为每 20 米 1 枚（热身区除外）· 皮肤与装扮点击即可装备 · 技能购买后可在商店自由开关</div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
(function(){
  'use strict';

  /* ================= 数据 ================= */
  const SKINS = [
    {id:'classic', name:'经典蓝', body:'#1652c9', limb:'#0e3a94', price:0,   desc:'初始配色'},
    {id:'crimson', name:'烈焰红', body:'#e8453c', limb:'#a52a22', price:120, desc:'热情似火'},
    {id:'forest',  name:'森林绿', body:'#2ea36b', limb:'#1c6f47', price:180, desc:'清新自然'},
    {id:'nebula',  name:'星云紫', body:'#8a5cf6', limb:'#5b34b8', price:280, desc:'神秘电光'},
    {id:'gold',    name:'黄金战甲', body:'#f0b400', limb:'#c48800', price:450,desc:'闪亮登场'},
    {id:'phantom', name:'幻影白', body:'#dbe7ff', limb:'#8fa6c9', price:650, desc:'极简质感'}
  ];
  const GEAR = [
    {id:'none',    name:'无装扮', icon:'—',   price:0,   desc:'轻装上阵'},
    {id:'scarf',   name:'疾风围巾', icon:'🧣', price:100, desc:'跑动时飘扬'},
    {id:'glasses', name:'酷炫墨镜', icon:'🕶️', price:150, desc:'酷就一个字'},
    {id:'cap',     name:'棒球帽',  icon:'🧢', price:190, desc:'街头风格'},
    {id:'wings',   name:'光翼',    icon:'🪽', price:380, desc:'背后发光翅膀'},
    {id:'crown',   name:'王者皇冠', icon:'👑', price:560, desc:'跑者之王'}
  ];
  const SKILLS = [
    {id:'double', name:'二段跳',  icon:'🪶', price:260, desc:'空中可再跳一次'},
    {id:'shield', name:'能量护盾', icon:'🛡️', price:340, desc:'每局免疫一次碰撞'},
    {id:'rich',   name:'金币加成', icon:'💰', price:220, desc:'金币收益 ×2'}
  ];
  const DIFFS = {
    easy:  {name:'简单', start:205, ramp:5,   gapMin:1.25, gapMax:1.80, size:.88, score:.8, coin:.8},
    normal:{name:'普通', start:260, ramp:7.5, gapMin:1.05, gapMax:1.55, size:1,   score:1,  coin:1},
    hard:  {name:'困难', start:330, ramp:12,  gapMin:.88,  gapMax:1.25, size:1.12,score:1.6, coin:1.5}
  };
  const THEMES = {
    light:{
      skyTop:'#dceeff', skyBottom:'#a9d0ff', sun:'#fff6d8', sunGlow:'rgba(255,235,170,.7)',
      cloud:'#ffffff', bldFar:'#c2dcf8', bldNear:'#a7c9ef', window:'#e8f3ff',
      ground:'#2f7bff', groundDark:'#1c5fd6', groundStripe:'#ffffff',
      charHead:'#ffcf8a', shadow:'rgba(22,82,201,.25)',
      block:'#ff8a3d', blockDark:'#dd6416', bar:'#7b5cff', barDark:'#5438c4',
      fx:'#ff5b6b', shield:'#8ef0ff'
    },
    dark:{
      skyTop:'#081a38', skyBottom:'#123a6d', sun:'#dce9ff', sunGlow:'rgba(150,190,255,.25)',
      cloud:'#1e3f70', bldFar:'#11284c', bldNear:'#0d2040', window:'#2f7bff',
      ground:'#1b4fb0', groundDark:'#12357d', groundStripe:'#3f8bff',
      charHead:'#ffd7a0', shadow:'rgba(0,0,0,.4)',
      block:'#ff7a45', blockDark:'#c9501f', bar:'#9a7bff', barDark:'#6b4fd6',
      fx:'#ff6b7d', shield:'#7fe9ff'
    }
  };

  /* ================= 存档 ================= */
  function load(key,def){try{const v=localStorage.getItem(key);return v===null?def:JSON.parse(v)}catch(e){return def}}
  function save(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
  let wallet = load('pk-wallet',0);
  let owned  = load('pk-owned',{skins:['classic'],gear:['none'],skills:[]});
  let equip  = load('pk-equip',{skin:'classic',gear:'none',skills:[]});
  let diffKey= load('pk-diff','normal');
  let best   = load('pk-best',0);
  owned.skins = Array.from(new Set([...(owned.skins||[]),'classic']));
  owned.gear  = Array.from(new Set([...(owned.gear||[]),'none']));
  owned.skills = owned.skills||[]; equip.skills=equip.skills||[];
  if(!DIFFS[diffKey])diffKey='normal';
  let D=DIFFS[diffKey];

  /* ================= 主题 ================= */
  let themeName = localStorage.getItem('pk-theme')||'dark';
  const root=document.documentElement;
  function applyTheme(name){
    themeName=name;root.setAttribute('data-theme',name);
    try{localStorage.setItem('pk-theme',name)}catch(e){}
    const label=name==='dark'?'☀ 浅色':'☾ 深色';
    document.querySelectorAll('[data-theme-toggle]').forEach(b=>b.textContent=label);
  }
  applyTheme(themeName);
  document.querySelectorAll('[data-theme-toggle]').forEach(b=>
    b.addEventListener('click',()=>applyTheme(themeName==='dark'?'light':'dark')));
  function C(){return THEMES[themeName]}

  /* ================= DOM ================= */
  const $=id=>document.getElementById(id);
  const COIN='<svg class="coin-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#c98a00"/><circle cx="12" cy="12" r="8.5" fill="#f5b301"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#ffe9a8" stroke-width="1" opacity=".8"/><text x="12" y="16.4" text-anchor="middle" font-size="12" font-weight="900" fill="#8a5a00">¥</text></svg>';
  const startScreen=$('startScreen'),gameScreen=$('gameScreen'),gameOverEl=$('gameOver');
  const scoreVal=$('scoreVal'),distVal=$('distVal'),coinVal=$('coinVal'),bestVal=$('bestVal');
  const finalScore=$('finalScore'),earnCoins=$('earnCoins');
  const canvas=$('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  bestVal.textContent=best;
  function refreshStartInfo(){
    const s=SKINS.find(x=>x.id===equip.skin)||SKINS[0];
    const g=GEAR.find(x=>x.id===equip.gear)||GEAR[0];
    $('gearText').textContent=s.name+' · '+g.name;
    $('heroIcon').querySelector('rect').setAttribute('fill',s.body);
    $('heroIcon').querySelector('path[stroke]').setAttribute('stroke',s.limb);
  }
  refreshStartInfo();

  /* ================= 音效（Web Audio，无外部文件） ================= */
  let muted=load('pk-muted',false);
  let audioCtx=null,musicTimer=null,musicStep=0;
  const MELODY=[523,659,784,659,587,698,880,698];
  function initAudio(){
    if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return}
    try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  }
  window.addEventListener('pointerdown',initAudio,{once:true});
  function tone(freq,dur,type,vol,slide){
    if(muted||!audioCtx)return;
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur);
  }
  function noise(dur,vol){
    if(muted||!audioCtx)return;
    const t=audioCtx.currentTime,len=Math.floor(audioCtx.sampleRate*dur);
    const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
    src.buffer=buf;f.type='lowpass';f.frequency.value=900;
    g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    src.connect(f);f.connect(g);g.connect(audioCtx.destination);src.start(t);
  }
  const SFX={
    jump(){
      if(muted)return;
      const a=$("jumpSfx");
      if(a&&a.src){
        try{
          const c=a.cloneNode();c.src=a.src;c.volume=.8;
          const r=c.play();if(r&&r.catch)r.catch(()=>tone(420,.14,"square",.09,260));
        }catch(e){tone(420,.14,"square",.09,260)}
      }else tone(420,.14,"square",.09,260);
    },
    crouch(){tone(180,.1,'triangle',.08,-60)},
    hit(){
      if(muted)return;
      const a=$("deathSfx");
      const fb=()=>{noise(.35,.25);tone(140,.35,"sawtooth",.12,-90)};
      if(a&&a.src){
        try{
          const c=a.cloneNode();c.src=a.src;c.volume=.85;
          const r=c.play();if(r&&r.catch)r.catch(fb);
        }catch(e){fb()}
      }else fb();
    },
    buy(){tone(660,.1,'sine',.1);setTimeout(()=>tone(880,.14,'sine',.1),90)},
    shield(){tone(300,.18,'sine',.1,400);setTimeout(()=>tone(700,.2,'sine',.08),120)},
    warmup(){tone(520,.1,'sine',.09);setTimeout(()=>tone(780,.16,'sine',.09),100)},
    click(){tone(520,.05,'sine',.05)}
  };
  function updateSoundBtn(){$('soundBtn').textContent=muted?'🔇':'🔊'}
  updateSoundBtn();
  $('soundBtn').addEventListener('click',()=>{
    initAudio();muted=!muted;save('pk-muted',muted);updateSoundBtn();
    if(!muted)SFX.click();
  });
  function musicTick(){
    if(!audioCtx)return;
    if(state==='playing'&&!muted){
      tone(MELODY[musicStep%MELODY.length],.16,'triangle',.035);
      if(musicStep%2===0)tone(130,.1,'sine',.045);
    }
    musicStep++;
    musicTimer=setTimeout(musicTick,220);
  }

  /* ================= 难度 ================= */
  function selectDiff(k){
    diffKey=k;D=DIFFS[k];save('pk-diff',k);
    document.querySelectorAll('.diff').forEach(b=>b.classList.toggle('on',b.dataset.diff===k));
  }
  document.querySelectorAll('.diff').forEach(b=>b.addEventListener('click',()=>selectDiff(b.dataset.diff)));
  selectDiff(diffKey);

  /* ================= 商店 ================= */
  const shopModal=$('shopModal'),shopGrid=$('shopGrid');
  let shopTab='skin';
  function toast(msg){
    const t=$('toast');t.textContent=msg;t.classList.add('show');
    clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1500);
  }
  function openShop(){renderShop();shopModal.classList.add('show')}
  function closeShop(){shopModal.classList.remove('show')}
  $('shopBtn').addEventListener('click',openShop);
  $('shopBtn2').addEventListener('click',openShop);
  $('closeShop').addEventListener('click',closeShop);
  shopModal.addEventListener('click',e=>{if(e.target===shopModal)closeShop()});
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    shopTab=t.dataset.tab;renderShop();
  }));
  const skillOn=id=>equip.skills.includes(id);
  function renderShop(){
    $('walletVal').textContent=wallet;
    const list=shopTab==='skin'?SKINS:shopTab==='gear'?GEAR:SKILLS;
    let html='';
    for(const it of list){
      const has=shopTab==='skill'?owned.skills.includes(it.id)
               :(shopTab==='skin'?owned.skins:owned.gear).includes(it.id);
      const active=shopTab==='skill'?skillOn(it.id)
                  :(shopTab==='skin'?equip.skin:equip.gear)===it.id;
      const pv=shopTab==='skin'
        ?'<div class="preview"><div class="swatch" style="background:'+it.body+'"></div></div>'
        :'<div class="preview">'+it.icon+'</div>';
      let btn;
      if(!has)btn='<button class="btn buy" data-act="buy" data-id="'+it.id+'">购买 '+COIN+it.price+'</button>';
      else if(shopTab==='skill')btn='<button class="btn buy '+(active?'active':'owned')+'" data-act="toggle" data-id="'+it.id+'">'+(active?'已开启 ✓':'已关闭')+'</button>';
      else btn='<button class="btn buy '+(active?'active':'owned')+'" data-act="equip" data-id="'+it.id+'">'+(active?'使用中 ✓':'装备')+'</button>';
      html+='<div class="card '+(active?'equipped':'')+'">'+pv+
            '<div class="name">'+it.name+'</div><div class="desc">'+it.desc+'</div>'+btn+'</div>';
    }
    shopGrid.innerHTML=html;
  }
  shopGrid.addEventListener('click',e=>{
    const b=e.target.closest('button[data-act]');if(!b)return;
    const id=b.dataset.id,act=b.dataset.act;
    const list=shopTab==='skin'?SKINS:shopTab==='gear'?GEAR:SKILLS;
    const it=list.find(x=>x.id===id);if(!it)return;
    if(act==='buy'){
      if(wallet<it.price){toast('金币不足，再去跑几局吧');return}
      wallet-=it.price;save('pk-wallet',wallet);
      if(shopTab==='skin'){owned.skins.push(id);equip.skin=id}
      else if(shopTab==='gear'){owned.gear.push(id);equip.gear=id}
      else{owned.skills.push(id);equip.skills.push(id)}
      save('pk-owned',owned);save('pk-equip',equip);
      refreshStartInfo();SFX.buy();toast('购买成功：'+it.name);
    }else if(act==='equip'){
      if(shopTab==='skin')equip.skin=id;else equip.gear=id;
      save('pk-equip',equip);refreshStartInfo();SFX.click();toast('已装备：'+it.name);
    }else if(act==='toggle'){
      const was=skillOn(id);
      equip.skills=was?equip.skills.filter(x=>x!==id):[...equip.skills,id];
      save('pk-equip',equip);SFX.click();toast((was?'已关闭：':'已开启：')+it.name);
    }
    renderShop();
  });

  /* ================= 游戏状态 ================= */
  const GROUND=350,CHAR_X=150,CHAR_W=40,STAND_H=62,CROUCH_H=30;
  const SAFE_DIST=420,COIN_DIST=20;
  const GRAVITY=1900,JUMP_VY=-720,CROUCH_TIME=.5;
  const BAR_TOP=118,BAR_BOTTOM=GROUND-46;

  let state='menu';
  let score=0,distance=0,passed=0,runCoins=0,speed=0,lastSpawn=0,nextGap=0,lastType='block';
  let charY=GROUND,vy=0,grounded=true,jumpsUsed=0,crouchTimer=0,invuln=0,shieldUsed=false;
  let obstacles=[],particles=[],clouds=[],blds=[],graceDone=false;
  let runPhase=0,elapsed=0,lastTime=0,raf=0;

  function rand(a,b){return a+Math.random()*(b-a)}
  function makeScenery(){
    clouds=Array.from({length:6},()=>({x:rand(0,W),y:rand(40,150),s:rand(.6,1.4),f:rand(.12,.3)}));
    blds=Array.from({length:12},(_,i)=>({x:i*90+rand(-20,20),w:rand(48,80),h:rand(50,130),f:rand(.25,.5)}));
  }
  makeScenery();
  function show(el){el.classList.add('active')}
  function hide(el){el.classList.remove('active')}

  function startGame(){
    score=0;distance=0;passed=0;runCoins=0;elapsed=0;speed=D.start;
    charY=GROUND;vy=0;grounded=true;jumpsUsed=0;crouchTimer=0;invuln=0;
    shieldUsed=false;obstacles=[];particles=[];lastSpawn=0;nextGap=SAFE_DIST;lastType='block';runPhase=0;graceDone=false;
    scoreVal.textContent=0;distVal.textContent=0;coinVal.textContent=0;
    $('tipText').textContent='难度：'+D.name+' · 前 '+SAFE_DIST+' 米热身（无障碍/无金币）· 之后每 '+COIN_DIST+' 米 1 金币 · '+
      (skillOn('shield')?'护盾已就位 · ':'')+(skillOn('double')?'二段跳已装备':'低矮路障用跳跃，高处横杆用下蹲');
    gameOverEl.classList.remove('show');
    hide(startScreen);show(gameScreen);
    state='playing';lastTime=performance.now();
    initAudio();if(audioCtx&&!musicTimer)musicTick();SFX.click();
    cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  }
  function toMenu(){
    state='menu';gameOverEl.classList.remove('show');
    refreshStartInfo();hide(gameScreen);show(startScreen);
  }
  function gameOverNow(){
    if(state!=='playing')return;
    state='over';
    SFX.hit();
    burst(CHAR_X+CHAR_W/2,charY-STAND_H/2,24);
    const gain=runCoins;wallet+=gain;save('pk-wallet',wallet);
    if(score>best){best=score;save('pk-best',best);bestVal.textContent=best}
    finalScore.textContent=score;earnCoins.textContent='获得金币 +'+gain+'（共 '+wallet+'）';
    setTimeout(()=>gameOverEl.classList.add('show'),140);
  }
  $('startBtn').addEventListener('click',startGame);
  $('restartBtn').addEventListener('click',startGame);
  $('menuBtn').addEventListener('click',toMenu);

  /* ================= 输入 ================= */
  function doJump(){
    if(state!=='playing')return;
    const canDouble=skillOn('double')&&!grounded&&jumpsUsed<2;
    if(!grounded&&!canDouble)return;
    crouchTimer=0;vy=JUMP_VY;grounded=false;jumpsUsed++;SFX.jump();
    for(let i=0;i<5;i++)particles.push({x:CHAR_X+rand(6,34),y:GROUND,vx:rand(-40,40),vy:rand(-60,-10),life:.3,max:.3,c:C().groundStripe,r:rand(1.5,3)});
  }
  function doCrouch(){if(state==='playing'){crouchTimer=CROUCH_TIME;SFX.crouch()}}
  function bindPress(id,fn){
    const el=$(id);
    el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('pressed');fn()});
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>el.classList.remove('pressed')));
  }
  bindPress('jumpBtn',doJump);bindPress('downBtn',doCrouch);
  window.addEventListener('keydown',e=>{
    if(shopModal.classList.contains('show')){if(e.code==='Escape')closeShop();return}
    if(state!=='playing')return;
    if(['ArrowUp','Space','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)doJump()}
    else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();doCrouch()}
  });

  /* ================= 逻辑 ================= */
  function burst(x,y,n){
    for(let i=0;i<n;i++){
      const a=rand(0,Math.PI*2),sp=rand(60,280);
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rand(.4,.9),max:1,
        c:Math.random()<.5?C().fx:C().block,r:rand(2,5)});
    }
  }
  const OB_TYPES=['block','bar','tall','mover'];
  function barBottom(o){return BAR_BOTTOM+Math.sin(elapsed*2.4+o.phase)*13}
  function spawn(){
    let type=OB_TYPES[Math.floor(Math.random()*OB_TYPES.length)];
    if(type===lastType&&Math.random()<.75){
      const others=OB_TYPES.filter(t=>t!==lastType);
      type=others[Math.floor(Math.random()*others.length)];
    }
    lastType=type;
    const x=W+30;
    if(type==='block'||type==='tall'){
      obstacles.push({type,x,w:rand(30,42),h:(type==='tall'?rand(72,88):rand(38,52))*D.size,passed:false});
    }else if(type==='bar'){
      obstacles.push({type,x,w:rand(34,46),top:BAR_TOP,bottom:BAR_BOTTOM,passed:false});
    }else{
      obstacles.push({type,x,w:rand(34,46),top:BAR_TOP,phase:rand(0,Math.PI*2),passed:false});
    }
    lastSpawn=distance;
    nextGap=Math.max(260,speed*rand(D.gapMin,D.gapMax));
  }
  function update(dt){
    elapsed+=dt;
    speed=Math.min(600,D.start+elapsed*D.ramp);
    distance+=speed*dt;
    score=Math.floor((distance/10+passed*5)*D.score);
    const coinMult=(skillOn('rich')?2:1)*D.coin;
    runCoins=Math.floor(Math.max(0,distance-SAFE_DIST)/COIN_DIST*coinMult);
    if(!graceDone&&distance>=SAFE_DIST){graceDone=true;SFX.warmup();toast('🏁 热身结束，金币开始累计')}
    scoreVal.textContent=score;distVal.textContent=Math.floor(distance/10);coinVal.textContent=runCoins;

    if(distance-lastSpawn>nextGap)spawn();

    if(!grounded){
      charY+=vy*dt;vy+=GRAVITY*dt;
      if(charY>=GROUND){charY=GROUND;vy=0;grounded=true;jumpsUsed=0}
    }
    if(crouchTimer>0)crouchTimer=Math.max(0,crouchTimer-dt);
    if(invuln>0)invuln=Math.max(0,invuln-dt);
    const curH=crouchTimer>0?CROUCH_H:STAND_H;
    runPhase+=dt*(grounded?10+speed/45:6);

    const cb={x:CHAR_X+6,y:charY-curH,w:CHAR_W-12,h:curH};
    for(const o of obstacles){
      o.x-=speed*dt;
      const groundObs=o.type==='block'||o.type==='tall';
      const bb=o.type==='mover'?barBottom(o):o.bottom;
      const box={x:o.x,y:groundObs?GROUND-o.h:o.top,w:o.w,h:groundObs?o.h:(bb-o.top)};
      if(!o.passed&&o.x+o.w<CHAR_X){o.passed=true;passed++}
      if(state==='playing'&&invuln<=0&&hit(cb,box)){
        if(skillOn('shield')&&!shieldUsed){
          shieldUsed=true;invuln=1.1;SFX.shield();
          for(let i=0;i<16;i++){const a=i/16*Math.PI*2;particles.push({x:CHAR_X+20,y:charY-30,vx:Math.cos(a)*180,vy:Math.sin(a)*180-40,life:.6,max:.6,c:C().shield,r:3})}
          toast('🛡️ 护盾抵消一次碰撞！');
        }else gameOverNow();
      }
    }
    obstacles=obstacles.filter(o=>o.x+o.w>-30);
    for(const c of clouds){c.x-=speed*c.f*dt;if(c.x<-80){c.x=W+rand(20,120);c.y=rand(40,150)}}
    for(const b of blds){b.x-=speed*b.f*dt;if(b.x+b.w<-20){b.x=W+rand(10,60);b.h=rand(50,130);b.w=rand(48,80)}}
    updateParticles(dt);
  }
  function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
  function updateParticles(dt){
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.life-=dt}
    particles=particles.filter(p=>p.life>0);
  }

  /* ================= 绘制 ================= */
  function hexA(hex,a){
    const n=parseInt(hex.slice(1),16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  function rr(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  function draw(){
    const c=C();
    const g=ctx.createLinearGradient(0,0,0,GROUND);
    g.addColorStop(0,c.skyTop);g.addColorStop(1,c.skyBottom);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,GROUND);
    ctx.save();ctx.shadowColor=c.sunGlow;ctx.shadowBlur=40;
    ctx.fillStyle=c.sun;ctx.beginPath();ctx.arc(W-110,90,38,0,Math.PI*2);ctx.fill();ctx.restore();

    ctx.fillStyle=c.cloud;
    for(const cl of clouds){
      ctx.globalAlpha=.85;ctx.beginPath();
      ctx.ellipse(cl.x,cl.y,42*cl.s,14*cl.s,0,0,Math.PI*2);
      ctx.ellipse(cl.x+24*cl.s,cl.y-8*cl.s,26*cl.s,16*cl.s,0,0,Math.PI*2);
      ctx.ellipse(cl.x-26*cl.s,cl.y-6*cl.s,28*cl.s,12*cl.s,0,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
    for(const b of blds){
      ctx.fillStyle=c.bldFar;ctx.fillRect(b.x,GROUND-b.h,b.w,b.h);
      ctx.fillStyle=c.bldNear;ctx.fillRect(b.x+4,GROUND-b.h+8,b.w-8,b.h-8);
      ctx.fillStyle=c.window;
      for(let wy=GROUND-b.h+18;wy<GROUND-12;wy+=22)
        for(let wx=b.x+10;wx<b.x+b.w-12;wx+=18)if(((wx+wy)|0)%3!==0)ctx.fillRect(wx,wy,6,8);
    }
    ctx.fillStyle=c.groundDark;ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.fillStyle=c.ground;ctx.fillRect(0,GROUND,W,12);
    ctx.fillStyle=c.groundStripe;ctx.globalAlpha=.5;
    const off=(distance*.8)%60;
    for(let x=-off;x<W;x+=60)ctx.fillRect(x,GROUND+26,30,4);
    ctx.globalAlpha=1;

    const air=Math.max(0,GROUND-charY);
    ctx.save();ctx.globalAlpha=Math.max(.12,.4-air/400);ctx.fillStyle=c.shadow;
    ctx.beginPath();ctx.ellipse(CHAR_X+CHAR_W/2,GROUND+4,26-air*.08,6-air*.02,0,0,Math.PI*2);ctx.fill();ctx.restore();

    drawRunner(c);
    for(const o of obstacles)drawObstacle(c,o);
    for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
  }
  function drawRunner(c){
    const sk=SKINS.find(s=>s.id===equip.skin)||SKINS[0];
    const body=sk.body,limb=sk.limb,gear=equip.gear;
    const curH=crouchTimer>0?CROUCH_H:STAND_H;
    const crouching=crouchTimer>0,cx=CHAR_X+CHAR_W/2;
    let hx,hy;
    ctx.save();ctx.translate(0,charY);

    // 能量护盾：以角色皮肤色为主的发光能量罩，绘制在角色身后
    if(skillOn('shield')&&!shieldUsed){
      const pulse=.5+.5*Math.sin(elapsed*4);
      const sy=-curH/2-2,rx=36,ry=curH/2+20;
      ctx.save();
      const grd=ctx.createRadialGradient(cx,sy,4,cx,sy,Math.max(rx,ry));
      grd.addColorStop(0,hexA(body,0));
      grd.addColorStop(.6,hexA(body,.06+pulse*.04));
      grd.addColorStop(1,hexA(body,.24+pulse*.08));
      ctx.fillStyle=grd;
      ctx.beginPath();ctx.ellipse(cx,sy,rx,ry,0,0,Math.PI*2);ctx.fill();
      ctx.shadowColor=body;ctx.shadowBlur=12+pulse*10;
      ctx.strokeStyle=hexA(body,.85);ctx.lineWidth=2.2;
      ctx.beginPath();ctx.ellipse(cx,sy,rx,ry,0,0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;
      const a0=elapsed*1.6;
      ctx.beginPath();ctx.ellipse(cx,sy,rx,ry,0,a0,a0+.7);ctx.stroke();
      ctx.beginPath();ctx.ellipse(cx,sy,rx,ry,0,a0+Math.PI,a0+Math.PI+.7);ctx.stroke();
      ctx.fillStyle='#fff';ctx.globalAlpha=.9;
      ctx.beginPath();ctx.arc(cx,sy-ry,2.5+pulse,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    if(gear==='wings'){
      ctx.save();ctx.globalAlpha=.75;ctx.fillStyle=c.shield;
      for(const s of [-1,1]){
        ctx.beginPath();
        ctx.ellipse(cx+s*20,-curH+26+Math.sin(runPhase*1.6)*4,12,26,s*.5,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    if(crouching){
      ctx.fillStyle=limb;ctx.strokeStyle=limb;ctx.lineWidth=8;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(CHAR_X+10,-2);ctx.lineTo(CHAR_X+30,-14);ctx.stroke();
      ctx.beginPath();ctx.moveTo(CHAR_X+30,-2);ctx.lineTo(CHAR_X+44,-12);ctx.stroke();
      ctx.fillStyle=body;rr(CHAR_X+4,-CROUCH_H+10,34,26,10);ctx.fill();
      hx=CHAR_X+42;hy=-CROUCH_H+12;
      ctx.fillStyle=c.charHead;ctx.beginPath();ctx.arc(hx,hy,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=limb;ctx.fillRect(hx-8,hy-4,12,5);
    }else{
      const swing=Math.sin(runPhase)*9,lift=grounded?0:-6;
      ctx.strokeStyle=limb;ctx.lineWidth=9;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cx-4,-26);ctx.lineTo(cx-4+swing,-4-lift-Math.max(0,swing)*.3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+4,-26);ctx.lineTo(cx+4-swing,-4-lift-Math.max(0,-swing)*.3);ctx.stroke();
      ctx.fillStyle=body;rr(CHAR_X+6,-curH+14,CHAR_W-12,curH-38,10);ctx.fill();
      ctx.strokeStyle=limb;ctx.lineWidth=7;
      ctx.beginPath();ctx.moveTo(cx+6,-curH+22);ctx.lineTo(cx+6-swing*.8,-curH+42);ctx.stroke();
      hx=cx+4;hy=-curH+10;
      ctx.fillStyle=c.charHead;ctx.beginPath();ctx.arc(hx,hy,12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=limb;ctx.fillRect(hx-2,hy-2,12,5);
    }

    if(gear==='scarf'){
      ctx.fillStyle='#ff5b6b';ctx.beginPath();
      ctx.moveTo(cx-8,hy+10);
      ctx.quadraticCurveTo(cx-34,hy+6+Math.sin(runPhase*1.5)*6,cx-46,hy+16);
      ctx.lineTo(cx-30,hy+18);ctx.quadraticCurveTo(cx-18,hy+14,cx-6,hy+18);
      ctx.closePath();ctx.fill();
    }
    if(gear==='glasses'){
      ctx.fillStyle='#16233c';rr(hx-11,hy-4,22,8,4);ctx.fill();
      ctx.fillStyle='#7fe9ff';rr(hx-9,hy-3,8,6,2);ctx.fill();rr(hx+1,hy-3,8,6,2);ctx.fill();
    }
    if(gear==='cap'){
      ctx.fillStyle=body;ctx.beginPath();ctx.arc(hx,hy-2,13,Math.PI,0);ctx.fill();
      ctx.fillStyle=limb;rr(hx+2,hy-5,18,5,2);ctx.fill();
    }
    if(gear==='crown'){
      ctx.fillStyle='#ffd23f';ctx.beginPath();
      ctx.moveTo(hx-13,hy-8);ctx.lineTo(hx-13,hy-20);ctx.lineTo(hx-6,hy-13);
      ctx.lineTo(hx,hy-24);ctx.lineTo(hx+6,hy-13);ctx.lineTo(hx+13,hy-20);
      ctx.lineTo(hx+13,hy-8);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.arc(hx,hy-15,3,0,Math.PI*2);ctx.fill();
    }

    if(invuln>0)ctx.globalAlpha=.5+Math.sin(elapsed*30)*.3;
    ctx.restore();ctx.globalAlpha=1;
  }
  function drawObstacle(c,o){
    if(o.type==='block'||o.type==='tall'){
      const y=GROUND-o.h,tall=o.type==='tall';
      ctx.fillStyle=c.blockDark;rr(o.x+2,y+3,o.w,o.h,5);ctx.fill();
      ctx.fillStyle=tall?'#e23b2e':c.block;rr(o.x,y,o.w,o.h-3,5);ctx.fill();
      ctx.save();ctx.beginPath();rr(o.x,y,o.w,o.h-3,5);ctx.clip();
      ctx.strokeStyle=c.blockDark;ctx.lineWidth=5;ctx.globalAlpha=tall?.35:.55;
      for(let i=-o.h;i<o.w+o.h;i+=tall?18:14){ctx.beginPath();ctx.moveTo(o.x+i,y+o.h);ctx.lineTo(o.x+i+o.h,y);ctx.stroke()}
      ctx.restore();
      ctx.fillStyle='#fff';ctx.globalAlpha=.8;ctx.fillRect(o.x+4,y+3,o.w-8,3);ctx.globalAlpha=1;
      if(tall){ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('跳',o.x+o.w/2,y+o.h/2+5)}
    }else{
      const bb=o.type==='mover'?barBottom(o):o.bottom,h=bb-o.top;
      ctx.fillStyle=c.barDark;ctx.fillRect(o.x+3,o.top+4,o.w,h);
      ctx.fillStyle=c.bar;rr(o.x,o.top,o.w,h,4);ctx.fill();
      ctx.fillStyle=c.barDark;ctx.fillRect(o.x-6,o.top-8,o.w+12,10);
      ctx.fillStyle=o.type==='mover'&&Math.sin(elapsed*7)>0?'#ffd23f':c.block;
      ctx.fillRect(o.x,bb-12,o.w,12);
      ctx.fillStyle='#fff';ctx.globalAlpha=.7;
      for(let i=0;i<o.w;i+=12)ctx.fillRect(o.x+i+3,bb-9,5,6);
      if(o.type==='mover'){ctx.globalAlpha=.95;ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('↕',o.x+o.w/2,o.top+20)}
      ctx.globalAlpha=1;
    }
  }

  /* ================= 主循环 ================= */
  function loop(now){
    let dt=(now-lastTime)/1000;lastTime=now;
    if(dt>0.05)dt=0.05;
    const shopOpen=shopModal.classList.contains('show');
    if(state==='playing'&&!shopOpen)update(dt);
    else if(state==='over'&&!shopOpen)updateParticles(dt);
    draw();raf=requestAnimationFrame(loop);
  }
  draw();raf=requestAnimationFrame(loop);
})();
</script>
